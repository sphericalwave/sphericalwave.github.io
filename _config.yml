repository:	     sphericalwave/sphericalwave.github.io
# Permalinks
#permalink:           /:year/:month/:day/:title/
permalink: /:categories/:title 
# might want to copy 
# https://github.com/arturomoncadatorres/arturomoncadatorres.github.io/blob/main/_config.yml

# Setup
title:               sphericalWave
description:         "sphericalWave is Aaron — websites that bring in customers, the business intelligence behind them, iOS apps, and decks and patios."
url:                 https://sphericalwave.com
logo:                /public/great-wave.png
image:               /public/great-wave.png
baseurl:             ""
analytics_id:        G-P9ZE6V8GK7

# Merch storefront (Fourthwall). Empty until the store is live — /merch/
# shows "opening soon" instead of linking to a store that does not exist.
# Set to e.g. https://store.sphericalwave.com (no trailing slash) to switch on
# every Buy button at once.
store_url:           ""

# Fourthwall Storefront API. Empty = /merch/ keeps its static cards.
# Token: Fourthwall admin -> Settings -> For Developers (starts ptkn_).
# It is a PUBLIC read-only catalogue token; checkout happens on Fourthwall.
# Injected at deploy from the FOURTHWALL_TOKEN repo secret — see
# .github/workflows/pages.yml. Left empty here so nothing token-shaped is ever
# committed. Empty means /merch/ serves its static cards, which is a safe
# degradation, not a breakage.
fourthwall_token:      ""

# Checkout host. store.sphericalwave.com is not serving yet (Fourthwall is
# still provisioning it), so checkout points at the Fourthwall address until
# it is. Swap this over once `curl -I https://store.sphericalwave.com` is 200.
fourthwall_shop:       "https://sphericalwave-shop.fourthwall.com"
fourthwall_collection: "all"
fourthwall_currency:   "CAD"

# Legacy personal content — HIDDEN, not deleted (repurpose later).
# Reverse by removing entries here + the posts `published: false` default.
# Jekyll defaults are re-listed so Gemfile/vendor stay excluded too.
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - _design
  - blog
  - tag
  - archive.html
  - tags.md
  - work.md
  - Coaching.md
  - store1.md
  - psyop.md
  - bioelectricity.md
  - biomechanics.md
  - update_tags.py
  - tamarack.md

# Assets
#
# We specify the directory for Jekyll so we can use @imports.
sass:
  sass_dir:          _sass
  style:            :compressed

# About/contact
author:
  name:              sphericalWave
#  url:               https://twitter.com/mecid
  email:             hello@sphericalwave.com

# Gems
plugins:
  - jekyll-avatar #don't think i need
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed     # kept; feed empty while posts unpublished, link removed from head

defaults:
  - scope:
      path: ""
    values:
      image: /public/great-wave.png
  # Hide all legacy posts without editing 41 files (reversible: delete this).
  - scope:
      path: ""
      type: posts
    values:
      published: false

collections:
  projects:
    output: false

tag_page_layout: tag_page
tag_page_dir: tag