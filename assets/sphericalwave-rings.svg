<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" role="img" aria-label="Concentric circles expanding outward" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    svg { --sw-color: #2B5F8A; --sw-period: 6s; }
    @media (prefers-color-scheme: dark) { svg { --sw-color: #7FB0D8; } }
    circle {
      stroke: var(--sw-color);
      stroke-width: 1.5;
      transform-box: fill-box;
      transform-origin: center;
      animation: sw-expand var(--sw-period) linear infinite;
    }
    /* Negative delays start every ring mid-flight, so the first frame is already a full field of rings */
    circle:nth-child(1) { animation-delay: calc(var(--sw-period) * -0/6); }
    circle:nth-child(2) { animation-delay: calc(var(--sw-period) * -1/6); }
    circle:nth-child(3) { animation-delay: calc(var(--sw-period) * -2/6); }
    circle:nth-child(4) { animation-delay: calc(var(--sw-period) * -3/6); }
    circle:nth-child(5) { animation-delay: calc(var(--sw-period) * -4/6); }
    circle:nth-child(6) { animation-delay: calc(var(--sw-period) * -5/6); }
    @keyframes sw-expand {
      0%   { transform: scale(0.02); opacity: 0; }
      8%   { opacity: 1; }
      100% { transform: scale(1);    opacity: 0; }
    }
    /* Reduced motion: rings freeze at their staggered sizes as a static pattern */
    @media (prefers-reduced-motion: reduce) { circle { animation-play-state: paused; } }
  </style>
  <g>
    <circle cx="200" cy="200" r="198" vector-effect="non-scaling-stroke"/>
    <circle cx="200" cy="200" r="198" vector-effect="non-scaling-stroke"/>
    <circle cx="200" cy="200" r="198" vector-effect="non-scaling-stroke"/>
    <circle cx="200" cy="200" r="198" vector-effect="non-scaling-stroke"/>
    <circle cx="200" cy="200" r="198" vector-effect="non-scaling-stroke"/>
    <circle cx="200" cy="200" r="198" vector-effect="non-scaling-stroke"/>
  </g>
</svg>
