<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" fill="none" role="img" aria-label="8 sets of concentric circles expanding outward from the corners of a regular octagon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    svg { --sw-color: #2B5F8A; --sw-period: 9s; }
    @media (prefers-color-scheme: dark) { svg { --sw-color: #7FB0D8; } }
    circle {
      stroke: var(--sw-color);
      stroke-width: 1.5;
      transform-box: fill-box;
      transform-origin: center;
      animation: sw-expand var(--sw-period) linear infinite;
    }
    /* 8 sources on a regular octagon, circumradius 173.2 (side 132.6), all in phase */
    circle:nth-child(1) { animation-delay: calc(var(--sw-period) * -0/9); }
    circle:nth-child(2) { animation-delay: calc(var(--sw-period) * -1/9); }
    circle:nth-child(3) { animation-delay: calc(var(--sw-period) * -2/9); }
    circle:nth-child(4) { animation-delay: calc(var(--sw-period) * -3/9); }
    circle:nth-child(5) { animation-delay: calc(var(--sw-period) * -4/9); }
    circle:nth-child(6) { animation-delay: calc(var(--sw-period) * -5/9); }
    circle:nth-child(7) { animation-delay: calc(var(--sw-period) * -6/9); }
    circle:nth-child(8) { animation-delay: calc(var(--sw-period) * -7/9); }
    circle:nth-child(9) { animation-delay: calc(var(--sw-period) * -8/9); }
    @keyframes sw-expand {
      0%   { transform: scale(0.02); opacity: 0; }
      6%   { opacity: 1; }
      100% { transform: scale(1);    opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { circle { animation-play-state: paused; } }
  </style>
